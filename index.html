<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Day 03 of my 50-day full-stack learning challenge: JavaScript arrays."
    />
    <title>Day 03 — JavaScript Arrays</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f4f7fb;
        color: #182230;
      }

      body {
        box-sizing: border-box;
        max-width: 760px;
        margin: 0 auto;
        padding: 48px 20px;
      }

      main {
        padding: 32px;
        border: 1px solid #dce3ed;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 12px 32px rgb(24 34 48 / 8%);
      }

      h1 {
        margin-top: 0;
      }

      p {
        color: #526174;
        line-height: 1.6;
      }

      pre {
        overflow-x: auto;
        min-height: 120px;
        margin: 24px 0 0;
        padding: 20px;
        border-radius: 10px;
        background: #111827;
        color: #d9e5f5;
        font: 14px/1.7 ui-monospace, monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      @media (max-width: 520px) {
        body {
          padding: 24px 14px;
        }

        main {
          padding: 22px 18px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Day 03: JavaScript Arrays</h1>
      <p>
        Part of my 50-day full-stack learning challenge. This page demonstrates
        array loops, <code>slice()</code>, <code>splice()</code>,
        <code>find()</code>, and a few array exercises.
      </p>
      <h2>JavaScript output</h2>
      <pre id="output" aria-live="polite">Running the examples...</pre>
    </main>

    <script>
      const output = document.querySelector("#output");
      const lines = [];

      function log(...values) {
        const line = values
          .map(value =>
            typeof value === "object" && value !== null
              ? JSON.stringify(value)
              : String(value)
          )
          .join(" ");

        lines.push(line);
        output.textContent = lines.join("\n");
      }

      const colors = ["red", "green", "blue"];

      // Classic for loop
      for (let i = 0; i < colors.length; i++) {
        log(i, colors[i]);
      }

      // for...of
      for (const color of colors) {
        log(color);
      }

      // forEach
      colors.forEach(color => log(color));

      // slice returns a new array; splice changes the original array.
      const nums = [10, 20, 30, 40, 50];
      const part = nums.slice(1, 3);

      log("slice result:", part);
      log("after slice:", nums);

      nums.splice(1, 2);
      log("splice result:", nums);

      // Find objects in an array.
      const users = [
        { id: 1, name: "Abel" },
        { id: 2, name: "Sara" },
        { id: 3, name: "Liya" }
      ];

      const foundUser = users.find(user => user.id === 2);
      log("User with id 2:", foundUser);
      log("User name:", foundUser.name);

      const foundUserByName = users.find(user => user.name === "Liya");
      log("User named Liya:", foundUserByName);

      // Exercise 1
      const foods = ["pasta", "tacos", "sushi", "pizza", "curry"];

      log("First food:", foods[0]);
      log("Last food:", foods[foods.length - 1]);
      log("Number of foods:", foods.length);

      foods.push("ramen");
      foods.unshift("dumplings");
      foods.pop();

      log("Includes pizza:", foods.includes("pizza"));

      for (let i = 0; i < foods.length; i++) {
        log("for loop:", foods[i]);
      }

      for (const food of foods) {
        log("for...of:", food);
      }

      foods.forEach(food => log("forEach:", food));

      const numbers = [5, 12, 8, 130, 44];
      let sum = 0;
      let largest = numbers[0];

      for (const number of numbers) {
        if (number > 10) {
          log("Greater than 10:", number);
        }

        sum += number;

        if (number > largest) {
          largest = number;
        }
      }

      log("Sum:", sum);
      log("Largest:", largest);
      log("Find Liya:", users.find(user => user.name === "Liya"));
    </script>
  </body>
</html>
